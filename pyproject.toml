[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyan-eclipse-legacy-recon"
version = "0.1.0"
description = "Point an agent at a codebase: narrowed-scope architecture map, dependency/EOL risk list."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cyan Eclipse Technologies LLC" },
]
keywords = ["mcp", "model-context-protocol", "legacy-code", "code-analysis", "dependency-risk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://cetech.ai"
Repository = "https://github.com/CYAN-ECLIPSE-TECHNOLOGIES-LLC/cyan-eclipse-legacy-recon-mcp"
Vendor = "https://cetech.ai"

[project.scripts]
eclipse-legacy-recon = "server:main"

# Packaging safety (found at first build, 2026-11-12): the test fixture
# fixtures/legacy-tree/escape_link is a tracked symlink to /etc (the
# symlink-escape case the engine must report). Hatchling's file walk
# dereferences it, so an unfiltered sdist silently packs the build
# machine's /etc (746 entries incl. gshadow) and the wheel-from-sdist
# step then fails on the absolute link. Exclude the symlink itself
# from every build target; the repo fixture is untouched and the
# tests/smoke recreate/check it in the source tree as before.
[tool.hatch.build]
exclude = [
    "/fixtures/legacy-tree/escape_link",
]

# Version lockstep: this version, the VERSION file, server.json, and the
# server.py docstring all read 0.1.0 — bump them together.
# Flat layout: the runtime is the top-level server.py module. Runtime
# data read beside server.py (Path(__file__).parent / ...) is
# force-included at the same relative path in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"recon_engine.py" = "recon_engine.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
"CLAIM-SCOPE.md" = "CLAIM-SCOPE.md"

[tool.hatch.build.targets.sdist.force-include]
"server.py" = "server.py"
"recon_engine.py" = "recon_engine.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
"CLAIM-SCOPE.md" = "CLAIM-SCOPE.md"
